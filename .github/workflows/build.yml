name: Build Luin

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:          # allows manual run

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Windows executable
        run: |
          g++ -std=c++17 -O2 -static -static-libgcc -static-libstdc++ *.cpp -o Luin.exe

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: Luin-Windows
          path: Luin.exe

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Linux binary
        run: |
          # Added static compilation flags here to make the binary standalone
          g++ -std=c++17 -O2 -static -static-libgcc -static-libstdc++ *.cpp -o luin
          mkdir -p luin_package/usr/bin
          mkdir -p luin_package/DEBIAN
          cp luin luin_package/usr/bin/
          printf '%s\n' \
            'Package: luin' \
            'Version: 2.3' \
            'Section: devel' \
            'Priority: optional' \
            'Architecture: amd64' \
            'Maintainer: silencekid14-dev' \
            'Description: Luin programming language interpreter' \
            > luin_package/DEBIAN/control 
          dpkg-deb --build luin_package luin.deb

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: Luin-Linux-deb
          path: luin.deb

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build macOS binary
        run: |
          # Omitted global "-static" (illegal on macOS) but kept static-libgcc and static-libstdc++
          g++ -std=c++17 -O2 -static-libgcc -static-libstdc++ -o luin *.cpp
          mkdir -p Luin.app/Contents/MacOS
          cp luin Luin.app/Contents/MacOS/Luin
          zip -r Luin-macOS.zip Luin.app

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: Luin-macOS
          path: Luin-macOS.zip
