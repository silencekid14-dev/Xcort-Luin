name: Build Luin

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:          # allows manual run

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Windows executable
        run: |
          g++ -std=c++17 -O2 -static -static-libgcc -static-libstdc++ *.cpp resource.res -o Luin_${{ github.ref_name }}_Windows.exe

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: Luin_${{ github.ref_name }}_Windows
          path: Luin_${{ github.ref_name }}_Windows.exe

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Linux binary
        run: |
          # Convert resource.res and securely assign non-executable stack parameters
          objcopy -I binary -O elf64-x86-64 -B i386 --set-section-flags .data=alloc,load,readonly,data resource.res resource.o
          
          # Compile the standalone static binary with an explicitly non-executable stack note
          g++ -std=c++17 -O2 -static -static-libgcc -static-libstdc++ *.cpp resource.o -Wl,-z,noexecstack -o luin
          
          # Strip the 'v' prefix out of the tag string safely for dpkg compatibility (e.g. v2.3 -> 2.3)
          CLEAN_VERSION=$(echo "${{ github.ref_name }}" | sed 's/^v//')
          
          mkdir -p luin_package/usr/bin
          mkdir -p luin_package/DEBIAN
          cp luin luin_package/usr/bin/Luin_${{ github.ref_name }}_Linux
          printf '%s\n' \
            'Package: luin' \
            "Version: $CLEAN_VERSION" \
            'Section: devel' \
            'Priority: optional' \
            'Architecture: amd64' \
            'Maintainer: silencekid14-dev' \
            'Description: Luin programming language interpreter' \
            > luin_package/DEBIAN/control 
          dpkg-deb --build luin_package Luin_${{ github.ref_name }}_Linux.deb

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: Luin_${{ github.ref_name }}_Linux
          path: Luin_${{ github.ref_name }}_Linux.deb

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build macOS binary
        run: |
          # Convert resource.res using native Apple link strings (-o instead of -output)
          ld -r -o resource.o -sectcreate __TEXT __info_plist resource.res
          
          # Compile Mach-O launcher bundle
          g++ -std=c++17 -O2 -stdlib=libc++ *.cpp resource.o -o luin
          mkdir -p Luin.app/Contents/MacOS
          cp luin Luin.app/Contents/MacOS/Luin_${{ github.ref_name }}_macOS
          zip -r Luin_${{ github.ref_name }}_macOS.zip Luin.app

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: Luin_${{ github.ref_name }}_macOS
          path: Luin_${{ github.ref_name }}_macOS.zip
